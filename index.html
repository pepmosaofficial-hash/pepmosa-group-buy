<script>

/* ================================
   OPEN / CLOSE ACCESS MODAL
================================ */

function openAccess(){
    const modal = document.getElementById("accessModal");

    if(modal){
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
    }
}

function closeAccess(){
    const modal = document.getElementById("accessModal");

    if(modal){
        modal.classList.remove("show");
    }

    document.body.style.overflow = "";
}


/* ================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
================================ */

const accessModal = document.getElementById("accessModal");

if(accessModal){

    accessModal.addEventListener("click", function(e){

        if(e.target === accessModal){
            closeAccess();
        }

    });

}


/* ================================
   APPROVAL POPUP
================================ */

function showApprovalPopup(){

    /* Remove old popup if one exists */
    const oldPopup = document.getElementById("approvalPopup");

    if(oldPopup){
        oldPopup.remove();
    }


    /* Create popup */
    const popup = document.createElement("div");

    popup.id = "approvalPopup";

    popup.innerHTML = `
        <div class="approval-overlay">

            <div class="approval-box">

                <button
                    class="approval-close"
                    onclick="closeApprovalPopup()"
                    type="button">
                    ×
                </button>

                <div class="approval-icon">
                    ✓
                </div>

                <h2>REQUEST SUBMITTED</h2>

                <p>
                    Your access request has been received.
                </p>

                <p class="approval-main">
                    Please wait for admin approval.
                </p>

                <div class="approval-status">
                    ⏳ WAITING FOR ADMIN APPROVAL
                </div>

                <button
                    class="approval-ok"
                    onclick="closeApprovalPopup()"
                    type="button">
                    OK
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(popup);

    document.body.style.overflow = "hidden";
}


/* ================================
   CLOSE APPROVAL POPUP
================================ */

function closeApprovalPopup(){

    const popup = document.getElementById("approvalPopup");

    if(popup){
        popup.remove();
    }

    document.body.style.overflow = "";
}


/* ================================
   SUBMIT ACCESS REQUEST
================================ */

function submitAccess(){

    const usernameElement =
        document.getElementById("username");

    const proofElement =
        document.getElementById("paymentProof");


    const username =
        usernameElement
        ? usernameElement.value.trim()
        : "";

    const proof =
        proofElement && proofElement.files
        ? proofElement.files[0]
        : null;


    /* Check username */

    if(!username){

        alert(
            "Please enter your name or Telegram username."
        );

        return;
    }


    /* Check payment proof */

    if(!proof){

        alert(
            "Please upload your payment screenshot."
        );

        return;
    }


    /*
       ================================
       REQUEST IS VALID
       ================================
    */


    /* Close the access form first */

    closeAccess();


    /*
       Small delay so the modal closes
       before the approval popup appears.
    */

    setTimeout(function(){

        showApprovalPopup();

    }, 250);


    /*
       Keep the user in WAITING status.
       Do NOT automatically give access.
    */

    console.log(
        "Access request submitted for:",
        username
    );

}


/* ================================
   APPROVAL POPUP STYLES
================================ */

const approvalStyles = document.createElement("style");

approvalStyles.innerHTML = `

#approvalPopup{
    position:fixed;
    inset:0;
    z-index:999999;
}

.approval-overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.65);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    backdrop-filter:blur(5px);
}

.approval-box{

    position:relative;

    width:100%;
    max-width:460px;

    background:#ffffff;

    border-radius:24px;

    padding:40px 30px 30px;

    text-align:center;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.35);

    animation:
        approvalPopupIn
        .25s ease-out;
}

.approval-close{

    position:absolute;

    top:12px;
    right:16px;

    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:#f4f4f4;

    color:#222;

    font-size:25px;

    cursor:pointer;

    line-height:36px;
}

.approval-close:hover{
    background:#eeeeee;
}

.approval-icon{

    width:75px;
    height:75px;

    margin:0 auto 20px;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #ed4b91,
        #9b5de5
    );

    color:white;

    font-size:42px;

    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;
}

.approval-box h2{

    margin:0 0 15px;

    font-size:26px;

    font-weight:800;

    color:#17141a;
}

.approval-box p{

    margin:8px 0;

    color:#666;

    font-size:16px;

    line-height:1.5;
}

.approval-main{

    color:#ed4b91 !important;

    font-weight:800;

    font-size:18px !important;

}

.approval-status{

    margin:25px 0;

    padding:14px 18px;

    border-radius:12px;

    background:#fff1f7;

    color:#9b5de5;

    font-size:14px;

    font-weight:800;

    letter-spacing:.3px;
}

.approval-ok{

    width:100%;

    padding:15px;

    border:none;

    border-radius:30px;

    background:linear-gradient(
        90deg,
        #ed4b91,
        #9b5de5
    );

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;
}

.approval-ok:hover{

    opacity:.9;

}

@keyframes approvalPopupIn{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

`;

document.head.appendChild(approvalStyles);


/* ================================
   ESC KEY CLOSES POPUP
================================ */

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        closeApprovalPopup();

    }

});

</script>
